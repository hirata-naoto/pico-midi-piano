[package]
name = "rp2040-app"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-rp = { version = "0.10", features = [
    "rp2040", "boot2-generic-03h", 
    "time-driver", "critical-section-impl", "defmt"]}
embassy-executor = { version = "0.7", features = ["executor-thread", "arch-cortex-m", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "generic-queue-8"] }
embassy-embedded-hal = "0.3"
embedded-hal-async = "1.0"
embedded-io-async = "0.6"
embassy-hal-internal = "=0.5.0"

cortex-m = "0.7"
cortex-m-rt = "0.7"

defmt = "0.3"
defmt-rtt = "0.4"

panic-probe = { version = "0.3", features = ["print-defmt"]}

[profile.release]
debug = 2
lto = true
opt-level = "z"

[profile.dev]
debug = 2
opt-level = 1